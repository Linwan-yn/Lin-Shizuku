# 本机 JDK 路径请勿入库；各构建机使用本机默认 JDK 17，需要时取消注释并改成自己的路径
#org.gradle.java.home=/path/to/jdk17
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
android.builder.sdkDownload=false
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37
android.r8.optimizedResourceShrinking=true
org.gradle.workers.max=1
